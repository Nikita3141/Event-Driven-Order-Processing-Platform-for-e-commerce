spring.application.name: order-processing-platform


spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/mydatabase
        username: myuser
        password: secret
        driver-class-name: org.postgresql.Driver
        jpa:
            hibernate:
                ddl-auto: none
            show-sql: true
            properties:
                hibernate:
                    dialect: org.hibernate.dialect.PostgreSQLDialect
        flyway:
            enabled: true
            locations: db/migration
            baseline-on-migrate: true
        api-docs:
            path: /api-docs
            swagger-ui:
                path: /swagger-ui.html
                tags-sorter: alpha
                operations-sorter: alpha
                display-request-duration: true
                persist-authorization: true  # Сохранять авторизацию между перезагрузками
jwt:
    secret: "dGVzdFNlY3JldEtleS0yNTYteW91ci1zZWNyZXQta2V5LWJhc2U2NC1lbmNvZGVkPQ=="
    access-expiration: 900000 # 15 мин
    refresh-expiration: 604800000 # 7 дней
    issuer: "E-Commerce-Auth-Service" #

